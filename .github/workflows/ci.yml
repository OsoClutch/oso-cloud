name: CI

# Runs on every push. No AWS credentials, no cost, nothing to configure:
# MOCK_BEDROCK=1 keeps the whole suite offline.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_BEDROCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the mock index
        run: python scripts/build_index.py

      - name: Tests
        run: python -m pytest -q

      - name: Generate a deck and check it end to end
        run: |
          python scripts/to_lugha_deck.py \
            --lang es --name Spanish --stage survival --level A1 \
            --out /tmp/es_survival.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/es_survival.json"))
          assert d["code"] == "es" and d["stage"] == "survival"
          assert d["reviewed"] is False, "generated decks must never self-certify"
          assert 12 <= len(d["cards"]) <= 24
          print(f"deck ok: {len(d['cards'])} cards, reviewed={d['reviewed']}")
          PY
