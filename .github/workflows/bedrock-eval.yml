name: Bedrock Eval

# Manual only. This one spends money and needs AWS credentials, so it never
# runs on push. It is the half of the test story that pytest cannot cover:
# whether the actual model stays grounded, refuses what it does not know, and
# ignores instructions embedded in its input.
#
# Required repository secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   BEDROCK_MODEL_ID
on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        default: us-east-1

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ inputs.region }}
      BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail early if the model id is missing
        run: |
          if [ -z "$BEDROCK_MODEL_ID" ]; then
            echo "BEDROCK_MODEL_ID secret is not set."
            echo "Copy the model or inference-profile id from the Bedrock console."
            exit 1
          fi

      - name: Build the real index
        run: python scripts/build_index.py

      - name: Start the API
        run: |
          nohup python -m uvicorn main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/health

      - name: Eval
        run: npx --yes promptfoo@latest eval --output eval.json --no-progress-bar

      - name: Report
        if: always()
        run: npx --yes promptfoo@latest eval --output eval.html --no-progress-bar || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval.json
            eval.html
            api.log
